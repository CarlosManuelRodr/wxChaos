  hero:
    tagline: An interactive fractal explorer for discovering, understanding, and creating complex patterns.
    first: wxChaos is an open-source application for exploring fractals through direct interaction. Move through familiar sets, follow the orbit behind a point, compare rendering methods, open a Julia preview, or examine the mathematics without leaving the application.
    second: It includes classic complex-plane fractals, chaotic maps, numerical systems, and vector constructions. Examples include Mandelbrot and Julia sets, Newton basins, the Burning Ship, the Henon and Logistic maps, the double pendulum, Sierpinski constructions, and the Koch snowflake.
    download: Download v2.0.0
    source: View source
    image_alt: wxChaos running in light and dark mode
    image_width: 2630
    image_height: 1973
  features:
    title: What you can do
    items:
      - title: Explore freely
        text: Pan, zoom, revisit earlier views, inspect coordinates, and move between related parameter and dynamical spaces.
      - title: See how the image is built
        text: Display point orbits, select Julia constants, inspect values with the point picker, and use documentation that connects explanations directly to the application.
      - title: Change the rendering
        text: Experiment with palettes, smooth coloring, orbit traps, Gaussian-integer coloring, escape angles, triangle inequality, and the other algorithms supported by each fractal.
      - title: Create your own fractals
        text: Enter custom formulas or use AngelScript to define complete fractals with options, rendering logic, orbits, and their own documentation.
      - title: Measure and record
        text: Estimate box-counting dimension, export still images, and create videos from a sequence of zooms.
      - title: Choose your language
        text: Use the interface and bundled documentation in English or Spanish, with additional project information available in Japanese.
  learn:
    title: Learn while exploring
    first: Every fractal can have its own illustrated documentation page. These pages introduce the visual idea first, then make the mathematics available when you want it.
    second: Interactive links can open a fractal, change its coloring, enable a tool, or move directly to a notable location.
    points:
      - Step-by-step iteration labs
      - Interactive formulas and simulations
      - Illustrated documentation for individual fractals
    image_alt: Animated zoom into a fractal in wxChaos
  tools:
    title: Tools
    intro: wxChaos includes tools for defining, measuring, configuring, and recording fractals.
    items:
      - image: script-editor.webp
        title: Script editor
        text: Write and run scripted fractals without rebuilding wxChaos.
        alt: The wxChaos script editor
      - image: dimension.webp
        title: Dimension calculator
        text: Estimate fractal dimension with the box-counting method.
        alt: The wxChaos fractal dimension calculator
      - image: renderer-options.webp
        title: Renderer options
        text: Choose the coloring algorithm, palette, precision, smoothing, orbit traps, and other rendering controls.
        alt: The wxChaos renderer options
      - image: zoom-recorder.webp
        title: Zoom recorder
        text: Export a video from a sequence of selected zoom views.
        alt: The wxChaos zoom recorder
  gallery:
    title: Gallery
    images:
      - file: fractal-1.webp
        alt: Fractal image generated with wxChaos
      - file: fractal-2.webp
        alt: Fractal image generated with wxChaos
      - file: fractal-3.webp
        alt: Fractal image generated with wxChaos
      - file: fractal-4.webp
        alt: Fractal image generated with wxChaos
  downloads:
    title: Download
    intro: Version 2.0.0 is available for 64-bit Windows and Linux.
    action: Download
    items:
      - key: windows_installer
        title: Windows installer
        detail: 64-bit setup executable
        note: Use this one if unsure.
        filename: wxChaos-2.0.0-windows-x64-setup.exe
      - key: windows_portable
        title: Windows portable
        detail: 64-bit portable ZIP archive
        note: Requires the Microsoft Visual C++ Redistributable (x64).
        note_link: Download it from Microsoft.
        note_url: https://aka.ms/vs/17/release/vc_redist.x64.exe
        filename: wxChaos-2.0.0-windows-x64-portable.zip
      - key: linux_appimage
        title: Linux AppImage
        detail: x86_64 AppImage
        note: Install the libfuse2 package before running the AppImage.
        filename: wxChaos-2.0.0-x86_64.AppImage
  project:
    title: Project information
    build_title: Build from source
    build_text: wxChaos builds on Windows and Linux using CMake. The build guide documents dependencies, configuration options, platform notes, and verified commands.
    build_link: Read the build guide
    contribute_title: Contributing
    contribute_text: Bug reports and focused improvements are welcome. Use the issue tracker for problems, feature ideas, and discussion.
    contribute_link: Open the issue tracker
    license_title: License
    license_text: wxChaos is free software licensed under the GNU General Public License version 3.
    license_link: Read the license
  footer:
    description: Open-source fractal exploration for Windows and Linux.
    releases: Releases
    source: Source code
    issues: Issues
    copyright: "© 2026 wxChaos contributors."

es:
  nav:
    skip: Ir al contenido
    menu: Abrir menú
    primary: Navegación principal
    features: Funciones
    tools: Herramientas
    gallery: Galería
    download: Descargar
    build: Compilar
    github: GitHub
    language: Elegir idioma
  hero:
    tagline: Un explorador de fractales interactivo para descubrir, comprender y crear patrones complejos.
    first: wxChaos es una aplicación de código abierto para explorar fractales mediante la interacción directa. Recorre conjuntos conocidos, sigue la órbita detrás de un punto, compara métodos de renderizado, abre una vista previa de Julia o examina las matemáticas sin salir de la aplicación.
    second: Incluye fractales clásicos del plano complejo, mapas caóticos, sistemas numéricos y construcciones vectoriales. Entre ellos se encuentran los conjuntos de Mandelbrot y Julia, las cuencas de Newton, Burning Ship, los mapas de Henon y Logístico, el péndulo doble, las construcciones de Sierpinski y el copo de nieve de Koch.
    download: Descargar v2.0.0
    source: Ver código fuente
    image_alt: wxChaos ejecutándose en los temas claro y oscuro
    image_width: 2629
    image_height: 1936
  features:
    title: Qué puedes hacer
    items:
      - title: Explorar con libertad
        text: Desplázate, haz zoom, vuelve a vistas anteriores, inspecciona coordenadas y muévete entre espacios de parámetros y espacios dinámicos relacionados.
      - title: Observar cómo se construye la imagen
        text: Muestra las órbitas de los puntos, selecciona constantes de Julia, inspecciona valores con el selector de puntos y utiliza documentación conectada directamente con la aplicación.
      - title: Cambiar el renderizado
        text: Experimenta con paletas, coloreado suave, trampas de órbita, enteros gaussianos, ángulos de escape, desigualdad triangular y los demás algoritmos compatibles con cada fractal.
      - title: Crear tus propios fractales
        text: Introduce fórmulas personalizadas o utiliza AngelScript para definir fractales completos con opciones, lógica de renderizado, órbitas y documentación propia.
      - title: Medir y grabar
        text: Estima la dimensión por conteo de cajas, exporta imágenes y crea vídeos a partir de una secuencia de acercamientos.
      - title: Elegir tu idioma
        text: Utiliza la interfaz y la documentación incluida en español o inglés, con información adicional del proyecto disponible en japonés.
  learn:
    title: Aprende mientras exploras
    first: Cada fractal puede tener su propia página de documentación ilustrada. Estas páginas presentan primero la idea visual y dejan disponibles los detalles matemáticos para cuando quieras profundizar.
    second: Los enlaces interactivos pueden abrir un fractal, cambiar su coloreado, activar una herramienta o ir directamente a una ubicación destacada.
    points:
      - Laboratorios de iteración paso a paso
      - Fórmulas y simulaciones interactivas
      - Documentación ilustrada para cada fractal
    image_alt: Acercamiento animado a un fractal en wxChaos
  tools:
    title: Herramientas
    intro: wxChaos incluye herramientas para definir, medir, configurar y grabar fractales.
    items:
      - image: script-editor.webp
        title: Editor de scripts
        text: Escribe y ejecuta fractales programados sin volver a compilar wxChaos.
        alt: El editor de scripts de wxChaos
      - image: dimension.webp
        title: Calculadora de dimensión
        text: Estima la dimensión fractal mediante el método de conteo de cajas.
        alt: La calculadora de dimensión fractal de wxChaos
      - image: renderer-options.webp
        title: Opciones del renderizador
        text: Elige el algoritmo de coloreado, la paleta, la precisión, el suavizado, las trampas de órbita y otros controles.
        alt: Las opciones del renderizador de wxChaos
      - image: zoom-recorder.webp
        title: Grabador de zoom
        text: Exporta un vídeo a partir de una secuencia de vistas seleccionadas.
        alt: El grabador de zoom de wxChaos
  gallery:
    title: Galería
    images:
      - file: fractal-1.webp
        alt: Imagen fractal generada con wxChaos
      - file: fractal-2.webp
        alt: Imagen fractal generada con wxChaos
      - file: fractal-3.webp
        alt: Imagen fractal generada con wxChaos
      - file: fractal-4.webp
        alt: Imagen fractal generada con wxChaos
  downloads:
    title: Descargar
    intro: La versión 2.0.0 está disponible para Windows y Linux de 64 bits.
    action: Descargar
    items:
      - key: windows_installer
        title: Instalador para Windows
        detail: Ejecutable de instalación de 64 bits
        note: Elige esta opción si no estás seguro.
        filename: wxChaos-2.0.0-windows-x64-setup.exe
      - key: windows_portable
        title: Windows portátil
        detail: Archivo ZIP portátil de 64 bits
        note: Requiere Microsoft Visual C++ Redistributable (x64).
        note_link: Descargar desde Microsoft.
        note_url: https://aka.ms/vs/17/release/vc_redist.x64.exe
        filename: wxChaos-2.0.0-windows-x64-portable.zip
      - key: linux_appimage
        title: AppImage para Linux
        detail: AppImage para x86_64
        note: Instala el paquete libfuse2 antes de ejecutar la AppImage.
        filename: wxChaos-2.0.0-x86_64.AppImage
  project:
    title: Información del proyecto
    build_title: Compilar desde el código fuente
    build_text: wxChaos se compila en Windows y Linux mediante CMake. La guía de compilación documenta las dependencias, opciones de configuración, notas de cada plataforma y comandos verificados.
    build_link: Leer la guía de compilación
    contribute_title: Contribuir
    contribute_text: Los reportes de errores y las mejoras concretas son bienvenidos. Utiliza el sistema de incidencias para problemas, ideas de funciones y discusión.
    contribute_link: Abrir el sistema de incidencias
