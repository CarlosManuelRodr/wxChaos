    language: Choose a language
    theme: Change color theme
  hero:
    kicker: Open-source fractal explorer
    title: Explore the beauty of chaos.
    lead: Discover familiar sets, follow the mathematics behind every point, and create complex worlds of your own.
    download: Download latest release
    source: View on GitHub
    meta_label: Project highlights
    meta:
      - Interactive exploration
      - Rich rendering
      - Scriptable
    image_alt: wxChaos running in its light and dark themes
    render_note: Multiple rendering algorithms
    theme_note: Light + dark themes
    scroll: Discover wxChaos
  intro:
    kicker: Fractals within reach
    title: A window into infinite complexity.
    first: wxChaos is an open-source application for exploring fractals through direct interaction. Move through familiar sets, follow the orbit behind a point, compare rendering methods, or examine the mathematics without leaving the application.
    second: Its collection spans classic complex-plane fractals, chaotic maps, numerical systems, and vector constructions—from Mandelbrot and Julia sets to Newton basins, the double pendulum, and Sierpinski patterns.
  features:
    kicker: Made for discovery
    title: Everything you need to explore.
    lead: Move from curious observation to creative experimentation with a toolkit designed around the fractal itself.
    items:
      - symbol: "⌖"
        title: Explore freely
        text: Pan, zoom, revisit earlier views, inspect coordinates, and move between related parameter and dynamical spaces.
      - symbol: "⤨"
        title: See how it is built
        text: Display point orbits, select Julia constants, inspect values, and connect explanations directly to the application.
      - symbol: "◉"
        title: Change the rendering
        text: Experiment with palettes, smooth coloring, orbit traps, Gaussian integers, escape angles, and triangle inequality.
      - symbol: "{ }"
        title: Create your own
        text: Enter custom formulas or use AngelScript to define complete fractals with options, rendering logic, and documentation.
      - symbol: "↗"
        title: Measure and record
        text: Estimate box-counting dimension, export still images, and create videos from a sequence of selected zooms.
      - symbol: "◐"
        title: Make it yours
        text: Work in light or dark mode and explore the interface and bundled documentation in your preferred language.
  explore:
    kicker: Learn while exploring
    title: Mathematics you can see and touch.
    first: Every fractal can have its own illustrated documentation page. Start with the visual idea, then reveal the mathematics when you want to go deeper.
    second: Interactive links can open a fractal, change its coloring, enable a tool, or move directly to a notable location.
    points:
      - Step-by-step iteration labs
      - Interactive formulas and simulations
      - Illustrated guides for individual fractals
    image_alt: Animated zoom into a colorful fractal
    caption: Zoom without limits
  tools:
    kicker: A complete workshop
    title: Go beyond the picture.
    lead: Powerful tools turn wxChaos from a viewer into a place to experiment, measure, and create.
    items:
      - image: script-editor.webp
        title: Script editor
        text: Write and run scripted fractals without rebuilding wxChaos.
        alt: The wxChaos script editor
      - image: dimension.webp
        title: Dimension calculator
        text: Estimate fractal dimension with the box-counting method.
        alt: The wxChaos fractal dimension calculator
      - image: renderer-options.webp
        title: Renderer options
        text: Choose coloring, palettes, precision, smoothing, orbit traps, and other rendering controls.
        alt: The wxChaos renderer options
      - image: zoom-recorder.webp
        title: Zoom recorder
        text: Export a video from a sequence of selected zoom views.
        alt: The wxChaos zoom recorder
  gallery:
    kicker: Generated with wxChaos
    title: A universe of forms.
    lead: Every formula, parameter, and palette opens another path through the boundary between order and chaos.
    images:
      - file: fractal-1.webp
        label: Complex plane
        alt: A purple and blue fractal generated with wxChaos
      - file: fractal-2.webp
        label: Branching detail
        alt: A branching blue fractal generated with wxChaos
      - file: fractal-3.webp
        label: Escape time
        alt: A vivid red and yellow fractal generated with wxChaos
      - file: fractal-4.webp
        label: Infinite forms
        alt: A blue spiral fractal generated with wxChaos
  cta:
    kicker: Begin exploring
    title: Ready to enter the fractal?
    text: Download the latest release, choose a starting point, and see where curiosity takes you.
    download: Download wxChaos
    build: Build from source
  footer:
    tagline: An interactive, open-source fractal explorer.
    project: Project
    download: Download
    build: Build from source
    releases: Release notes
    community: Community
    source: Source code
    issues: Report an issue
    license: GPL v3 license
    copyright: "© 2026 wxChaos contributors."
    made: Built for curious minds.

es:
  routes:
    home: /es/
  nav:
    skip: Ir al contenido
    home_label: Inicio de wxChaos
    menu: Abrir menú
    primary: Navegación principal
    features: Funciones
    tools: Herramientas
    gallery: Galería
    build: Compilar
    github: GitHub
    language: Elegir idioma
    theme: Cambiar tema de color
  hero:
    kicker: Explorador de fractales de código abierto
    title: Explora la belleza del caos.
    lead: Descubre conjuntos conocidos, sigue las matemáticas detrás de cada punto y crea tus propios mundos complejos.
    download: Descargar la última versión
    source: Ver en GitHub
    meta_label: Características del proyecto
    meta:
      - Exploración interactiva
      - Renderizado avanzado
      - Programable
    image_alt: wxChaos ejecutándose en sus temas claro y oscuro
    render_note: Múltiples algoritmos de renderizado
    theme_note: Temas claro y oscuro
    scroll: Descubre wxChaos
  intro:
    kicker: Fractales a tu alcance
    title: Una ventana a la complejidad infinita.
    first: wxChaos es una aplicación de código abierto para explorar fractales mediante la interacción directa. Recorre conjuntos conocidos, sigue la órbita detrás de un punto, compara métodos de renderizado o examina las matemáticas sin salir de la aplicación.
    second: Su colección abarca fractales clásicos del plano complejo, mapas caóticos, sistemas numéricos y construcciones vectoriales, desde Mandelbrot y Julia hasta las cuencas de Newton, el péndulo doble y los patrones de Sierpinski.
  features:
    kicker: Creado para descubrir
    title: Todo lo necesario para explorar.
    lead: Pasa de la observación curiosa a la experimentación creativa con herramientas diseñadas alrededor del propio fractal.
    items:
      - symbol: "⌖"
        title: Explora libremente
        text: Desplázate, haz zoom, vuelve a vistas anteriores, inspecciona coordenadas y recorre espacios relacionados.
      - symbol: "⤨"
        title: Observa cómo se construye
        text: Muestra órbitas, selecciona constantes de Julia, inspecciona valores y conecta las explicaciones con la aplicación.
      - symbol: "◉"
        title: Cambia el renderizado
        text: Experimenta con paletas, suavizado, trampas de órbita, enteros gaussianos, ángulos de escape y desigualdad triangular.
      - symbol: "{ }"
        title: Crea tus propios fractales
        text: Introduce fórmulas o utiliza AngelScript para definir fractales completos con opciones, lógica de renderizado y documentación.
      - symbol: "↗"
        title: Mide y graba
        text: Estima la dimensión por conteo de cajas, exporta imágenes y crea vídeos a partir de una secuencia de acercamientos.
      - symbol: "◐"
        title: Hazlo tuyo
        text: Trabaja en modo claro u oscuro y utiliza la interfaz y la documentación en tu idioma preferido.
  explore:
    kicker: Aprende mientras exploras
    title: Matemáticas que puedes ver y tocar.
    first: Cada fractal puede tener su propia página de documentación ilustrada. Comienza con la idea visual y descubre las matemáticas cuando quieras profundizar.
    second: Los enlaces interactivos pueden abrir un fractal, cambiar su color, activar una herramienta o llevarte a un lugar destacado.
    points:
      - Laboratorios de iteración paso a paso
      - Fórmulas y simulaciones interactivas
      - Guías ilustradas para cada fractal
    image_alt: Acercamiento animado a un fractal colorido
    caption: Acércate sin límites
  tools:
    kicker: Un taller completo
    title: Ve más allá de la imagen.
    lead: Sus herramientas convierten wxChaos en un lugar para experimentar, medir y crear.
    items:
      - image: script-editor.webp
        title: Editor de scripts
        text: Escribe y ejecuta fractales programados sin volver a compilar wxChaos.
        alt: El editor de scripts de wxChaos
      - image: dimension.webp
        title: Calculadora de dimensión
        text: Estima la dimensión fractal mediante el método de conteo de cajas.
        alt: La calculadora de dimensión fractal de wxChaos
      - image: renderer-options.webp
        title: Opciones del renderizador
        text: Elige el color, la paleta, la precisión, el suavizado, las trampas de órbita y otros controles.
        alt: Las opciones del renderizador de wxChaos
      - image: zoom-recorder.webp
        title: Grabador de zoom
        text: Exporta un vídeo a partir de una secuencia de vistas seleccionadas.
        alt: El grabador de zoom de wxChaos
  gallery:
    kicker: Generado con wxChaos
    title: Un universo de formas.
    lead: Cada fórmula, parámetro y paleta abre otro camino por la frontera entre el orden y el caos.
    images:
      - file: fractal-1.webp
        label: Plano complejo
        alt: Fractal morado y azul generado con wxChaos
      - file: fractal-2.webp
        label: Detalle ramificado
        alt: Fractal azul ramificado generado con wxChaos
      - file: fractal-3.webp
        label: Tiempo de escape
        alt: Fractal rojo y amarillo generado con wxChaos
      - file: fractal-4.webp
        label: Formas infinitas
        alt: Fractal espiral azul generado con wxChaos
  cta:
    kicker: Comienza a explorar
    title: ¿Listo para entrar en el fractal?
    text: Descarga la versión más reciente, elige un punto de partida y descubre hasta dónde te lleva la curiosidad.
    download: Descargar wxChaos
    build: Compilar desde el código
  footer:
    tagline: Un explorador de fractales interactivo y de código abierto.
    project: Proyecto
    download: Descargar
    build: Compilar desde el código
    releases: Notas de versiones
    community: Comunidad
    source: Código fuente
