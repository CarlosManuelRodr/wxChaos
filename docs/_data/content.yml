ja:
  nav:
    skip: コンテンツへ移動
    menu: メニューを開く
    primary: メインナビゲーション
    features: 機能
    tools: ツール
    gallery: ギャラリー
    download: ダウンロード
    build: ビルド
    github: GitHub
    language: 言語を選択
  hero:
    tagline: 複雑なパターンを探索し、その仕組みを理解し、自分で作るためのインタラクティブなフラクタル探索アプリケーションです。
    first: wxChaosは、直接操作しながらフラクタルを探索できるオープンソースのアプリケーションです。よく知られた集合の中を移動し、点の軌道をたどり、描画方法を比較し、Juliaプレビューを開き、アプリケーションを離れることなく数学的な仕組みを確認できます。
    second: 複素平面上の古典的なフラクタルだけでなく、カオス写像、数値計算によるシステム、ベクター図形による構成も収録しています。Mandelbrot集合、Julia集合、Newton法の吸引域、Burning Ship、Henon写像、Logistic写像、二重振り子、Sierpinski図形、Koch雪片などを探索できます。
    download: v2.0.0をダウンロード
    source: ソースコードを見る
    image_alt: ライトテーマとダークテーマで動作するwxChaos
    image_width: 2582
    image_height: 1899
  features:
    title: 主な機能
    items:
      - title: 自由に探索
        text: パンやズーム、以前の表示への復帰、座標の確認ができ、関連するパラメータ空間と力学系平面の間を行き来できます。
      - title: 画像が作られる過程を観察
        text: 点の軌道を表示し、Julia定数を選択し、ポイントピッカーで値を調べ、アプリケーションに直接つながるドキュメントを利用できます。
      - title: 描画方法を変更
        text: パレット、スムーズカラーリング、軌道トラップ、ガウス整数カラーリング、発散角、三角不等式など、各フラクタルが対応するアルゴリズムを試せます。
      - title: 独自のフラクタルを作成
        text: 数式の入力やAngelScriptを使って、オプション、描画ロジック、軌道、専用ドキュメントを備えたフラクタルを定義できます。
      - title: 測定と記録
        text: ボックスカウント法による次元の推定、静止画のエクスポート、連続するズームからの動画作成ができます。
      - title: 言語を選択
        text: インターフェースと付属ドキュメントは英語とスペイン語に対応し、プロジェクト情報は日本語でも読めます。
  learn:
    title: 探索しながら学ぶ
    first: 各フラクタルには図を使った専用のドキュメントページを用意できます。まず視覚的な考え方を紹介し、必要に応じて数学的な詳細を読める構成です。
    second: インタラクティブなリンクから、フラクタルを開く、配色を変更する、ツールを有効にする、注目すべき場所へ直接移動するといった操作ができます。
    points:
      - 段階ごとに進む反復計算ラボ
      - インタラクティブな数式とシミュレーション
      - 各フラクタルの図解ドキュメント
    image_alt: wxChaosでフラクタルへズームするアニメーション
  tools:
    title: ツール
    intro: wxChaosには、フラクタルの定義、測定、設定、記録に使うツールが含まれています。
    items:
      - image: script-editor.webp
        title: スクリプトエディター
        text: wxChaosを再ビルドせずに、スクリプトによるフラクタルを記述して実行できます。
        alt: wxChaosのスクリプトエディター
      - image: dimension.webp
        title: 次元計算
        text: ボックスカウント法でフラクタル次元を推定します。
        alt: wxChaosのフラクタル次元計算ツール
      - image: renderer-options.webp
        title: レンダラー設定
        text: カラーリングアルゴリズム、パレット、精度、スムージング、軌道トラップなどを変更できます。
        alt: wxChaosのレンダラー設定
      - image: zoom-recorder.webp
        title: ズームレコーダー
        text: 選択した複数のズーム表示から動画をエクスポートします。
        alt: wxChaosのズームレコーダー
  gallery:
    title: ギャラリー
    images:
      - file: fractal-1.webp
        alt: wxChaosで生成したフラクタル画像
      - file: fractal-2.webp
        alt: wxChaosで生成したフラクタル画像
      - file: fractal-3.webp
        alt: wxChaosで生成したフラクタル画像
      - file: fractal-4.webp
        alt: wxChaosで生成したフラクタル画像
  downloads:
    title: ダウンロード
    intro: バージョン2.0.0は、64ビット版WindowsおよびLinuxで利用できます。
    action: ダウンロード
    items:
      - key: windows_installer
        title: Windows インストーラー
        detail: 64ビット版セットアップ実行ファイル
        note: どれを選べばよいかわからない場合は、こちらを使用してください。
        filename: wxChaos-2.0.0-windows-x64-setup.exe
      - key: windows_portable
        title: Windows ポータブル
        detail: 64ビット版ポータブルZIP
        note: Microsoft Visual C++ Redistributable (x64) が必要です。
        note_link: Microsoftからダウンロードしてください。
