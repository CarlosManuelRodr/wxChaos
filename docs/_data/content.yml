ja:
  routes:
    home: /ja/
  nav:
    skip: コンテンツへ移動
    home_label: wxChaos ホーム
    menu: メニューを開く
    primary: メインナビゲーション
    features: 機能
    tools: ツール
    gallery: ギャラリー
    build: ビルド
    github: GitHub
    language: 言語を選択
    theme: カラーテーマを変更
  hero:
    kicker: オープンソースのフラクタル探索アプリ
    title: カオスの美しさを探索しよう。
    lead: よく知られた集合を巡り、各点の背後にある数学をたどり、自分だけの複雑な世界を作り出せます。
    download: 最新版をダウンロード
    source: GitHubで見る
    meta_label: プロジェクトの特長
    meta:
      - インタラクティブな探索
      - 多彩な描画方式
      - スクリプト対応
    image_alt: ライトテーマとダークテーマで動作するwxChaos
    render_note: 多彩な描画アルゴリズム
    theme_note: ライト・ダークテーマ
    scroll: wxChaosを詳しく見る
  intro:
    kicker: フラクタルを身近に
    title: 無限の複雑さをのぞく窓。
    first: wxChaosは、直接操作しながらフラクタルを探索できるオープンソースのアプリケーションです。集合の中を移動し、点の軌道をたどり、描画方法を比較し、アプリを離れずに数学を確認できます。
    second: 複素平面上の古典的なフラクタルから、カオス写像、数値計算システム、ベクター図形までを収録。Mandelbrot集合やJulia集合、Newton法の吸引域、二重振り子、Sierpinski図形などを探索できます。
  features:
    kicker: 発見のための設計
    title: 探索に必要なすべてを。
    lead: フラクタルそのものを中心に設計されたツールで、好奇心から創造的な実験へ進めます。
    items:
      - symbol: "⌖"
        title: 自由に探索
        text: パンやズーム、以前の表示への復帰、座標の確認、関連するパラメータ空間と力学系平面の移動ができます。
      - symbol: "⤨"
        title: 仕組みを観察
        text: 点の軌道やJulia定数、各種の値を表示し、解説からアプリケーションを直接操作できます。
      - symbol: "◉"
        title: 描画方法を変更
        text: パレット、スムーズカラーリング、軌道トラップ、ガウス整数、発散角、三角不等式などを試せます。
      - symbol: "{ }"
        title: 独自のフラクタルを作成
        text: 数式の入力やAngelScriptを使い、オプション、描画ロジック、ドキュメントを備えたフラクタルを定義できます。
      - symbol: "↗"
        title: 測定と記録
        text: ボックスカウント法による次元の推定、静止画の保存、連続ズームからの動画作成ができます。
      - symbol: "◐"
        title: 自分好みの環境
        text: ライト・ダークテーマを切り替え、好みの言語でインターフェースとドキュメントを利用できます。
  explore:
    kicker: 探索しながら学ぶ
    title: 見て、触れて理解する数学。
    first: 各フラクタルには図を使った専用ドキュメントを用意できます。まず視覚的なアイデアに触れ、必要なときに数学を深く学べます。
    second: インタラクティブなリンクからフラクタルを開き、配色を変更し、ツールを有効にし、注目すべき場所へ移動できます。
    points:
      - 段階的に進む反復計算ラボ
      - インタラクティブな数式とシミュレーション
      - 各フラクタルの図解ガイド
    image_alt: 鮮やかなフラクタルへズームするアニメーション
    caption: 限界のないズーム
  tools:
    kicker: 充実したワークショップ
    title: 画像の先へ。
    lead: wxChaosは、眺めるだけでなく実験し、測定し、創造するための強力なツールを備えています。
    items:
      - image: script-editor.webp
        title: スクリプトエディター
        text: wxChaosを再ビルドせずに、スクリプトによるフラクタルを記述して実行できます。
        alt: wxChaosのスクリプトエディター
      - image: dimension.webp
        title: 次元計算
        text: ボックスカウント法でフラクタル次元を推定します。
        alt: wxChaosのフラクタル次元計算ツール
      - image: renderer-options.webp
        title: レンダラー設定
        text: カラーリング、パレット、精度、スムージング、軌道トラップなどを変更できます。
        alt: wxChaosのレンダラー設定
      - image: zoom-recorder.webp
        title: ズームレコーダー
        text: 選択した複数のズーム表示から動画をエクスポートします。
        alt: wxChaosのズームレコーダー
  gallery:
    kicker: wxChaosで生成
    title: 無限に広がる形。
    lead: 数式、パラメータ、パレットを変えるたびに、秩序とカオスの境界を巡る新しい道が開きます。
    images:
      - file: fractal-1.webp
        label: 複素平面
        alt: wxChaosで生成した紫と青のフラクタル
      - file: fractal-2.webp
        label: 枝分かれの細部
        alt: wxChaosで生成した枝分かれする青いフラクタル
      - file: fractal-3.webp
        label: 発散時間
        alt: wxChaosで生成した赤と黄色のフラクタル
      - file: fractal-4.webp
        label: 無限の形
        alt: wxChaosで生成した青い渦巻き状のフラクタル
  cta:
    kicker: 探索を始めよう
    title: フラクタルの世界へ入りませんか？
    text: 最新版をダウンロードして出発点を選び、好奇心の向かう先を探してみましょう。
    download: wxChaosをダウンロード
    build: ソースからビルド
  footer:
