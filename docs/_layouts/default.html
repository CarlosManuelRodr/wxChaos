---
---
<!doctype html>
<html lang="{{ page.lang | default: site.lang }}" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10071f">
    <meta name="color-scheme" content="dark light">
    <title>{{ page.title }} · {{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" hreflang="en" href="{{ '/' | absolute_url }}">
    <link rel="alternate" hreflang="es" href="{{ '/es/' | absolute_url }}">
    <link rel="alternate" hreflang="ja" href="{{ '/ja/' | absolute_url }}">
    <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ page.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">

    <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script>
      (function () {
        var savedTheme = null;
        var preferredTheme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";

        try {
          savedTheme = localStorage.getItem("wxchaos-theme");
        } catch (error) {
          savedTheme = null;
        }

        document.documentElement.dataset.theme = savedTheme || preferredTheme;
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">{{ site.data.content[page.lang].nav.skip }}</a>
    {{ content }}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
